version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    # The minimum file pins the hacs.json floor on purpose; bumping it breaks
    # the "Minimum HA compatibility" job and hides floor regressions.
    exclude-paths:
      - requirements-test-minimum.txt
    schedule:
      interval: monthly
