# Optional view; standalone examples remain supported.
title: Native documents
path: native-documents
type: sections
max_columns: 1
sections:
  - type: grid
    cards:
      # Friendly device/room name; repeat a heading for each printer group.
      - type: heading
        heading: Office printer
        heading_style: title
      # One stack per tile prevents the shorter tile stretching with its neighbour.
      - type: vertical-stack
        grid_options:
          columns: 6
          rows: auto
        cards:
          - type: tile
            entity: sensor.printer_current_scan
            name: Scan
            icon: mdi:scanner
            hide_state: true
            tap_action:
              action: none
            icon_tap_action:
              action: none
            features_position: bottom
            features:
              - type: custom:escl-scan-feature
                duplex: false
      - type: vertical-stack
        grid_options:
          columns: 6
          rows: auto
        cards:
          - type: tile
            entity: sensor.printer_current_job
            name: Print
            icon: mdi:printer
            hide_state: true
            tap_action:
              action: none
            icon_tap_action:
              action: none
            features_position: bottom
            features:
              - type: custom:ipp-print-feature
                duplex: false
