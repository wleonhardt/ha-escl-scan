start:
  fields:
    source:
      example: Feeder
      selector:
        select:
          options:
            - Platen
            - Feeder
    dpi:
      example: 300
      selector:
        number:
          min: 50
          max: 1200
          step: 1
          unit_of_measurement: dpi
          mode: box
    color:
      example: color
      selector:
        select:
          options:
            - color
            - gray
    duplex:
      example: false
      selector:
        boolean:
    page_size:
      example: letter
      selector:
        select:
          options: [full, letter, a4, custom]
    width:
      example: 2550
      selector:
        number:
          min: 1
          max: 60000
          step: 1
          mode: box
    height:
      example: 3300
      selector:
        number:
          min: 1
          max: 60000
          step: 1
          mode: box

cancel:
  fields:
    scan_id:
      example: 3f9a1c2b4d5e
      selector:
        text:

scan_backs:
  fields:
    reverse_back_order:
      default: false
      selector:
        boolean:
    scan_id:
      example: 3f9a1c2b4d5e
      selector:
        text:
